<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
    <h1>Task Manager</h1>

    <form method="POST" action="/add" class="mb-3">
        <input type="text" name="task" placeholder="New Task" class="form-control" required>
        <button type="submit" class="btn btn-primary mt-2">Add Task</button>
    </form>

    <ul class="list-group">
        {% for t in tasks %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            {% if t.completed %}
            <del>{{ t.task }}</del>
            {% else %}
            {{ t.task }}
            {% endif %}
            <span>
                <a href="/complete/{{ loop.index0 }}" class="btn btn-success btn-sm">Complete</a>
                <a href="/delete/{{ loop.index0 }}" class="btn btn-danger btn-sm">Delete</a>
            </span>
        </li>
        {% endfor %}
    </ul>

    <hr>
    <h2>Password Generator API</h2>
    <p>Call <code>/api/generate-password?length=16</code> to get a random password in JSON.</p>
</body>
</html>
